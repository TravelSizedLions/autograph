name: Build Dev Branch
run-name: '[build] "${{ github.event.head_commit.message }}"'
on:
  pull_request:
    branches:
      - dev

env:
  ACTIONS: TravelSizedLions/actions/.github/workflows
  
jobs:
  dump:
    name: Inspect
    uses: $ACTIONS/dump-vars.yaml@dev

  run-tests:
    name: Verify
    uses: $ACTIONS/test-drive.yaml@dev
  
  version-bump:
    name: Versioning
    needs: run-tests
    uses: $ACTIONS/bump-patch.yaml@dev
