name: Build Dev Branch
run-name: 'Build Dev: ${{github.sha}}'
on:
  pull_request:
    branches: ["dev"]

jobs:
  Run Tests:
    id: run-tests
    uses: TravelSizedLions/actions/.github/workflows/merge-request.yaml@dev
  
  Bump Patch Version:
    needs: run-tests
    uses: ./.github/workflows/bump-versions.yaml
